apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomsoir-client-web
spec:
  replicas: "{{ .Values.replicaCount }}"
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: tomsoir-client-web

  # Make sure that readinessProbe is specififed as well.
  strategy:
    # Update strategy
    type: RollingUpdate
    rollingUpdate:
      # Maximum number of additional pods that can be created
      # above the desired number of pods during the update
      maxSurge: 1
      # Maximum number of pods that can be unavailable during the update
      # Note: it must be set to 0 if app consyst from only 1 pod otherwise
      # you will see 503 for 5-10 seconds during pods restart
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: tomsoir-client-web
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: tomsoir-client-web # Match pods with this label
              topologyKey: kubernetes.io/hostname # Ensure pods are scheduled on different nodes

      containers:
        - name: tomsoir-client-web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10

          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
